# Starter pipeline

# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- script: echo Hello, world!
  displayName: 'Run a one-line script'
- task: DownloadSecureFile@1
  name: publickey
  inputs:
    secureFile: 'azure_rsa.pub'
- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(System.DefaultWorkingDirectory)\configuration\iaac\azure\kubernates'
    commandOptions: '-var client_id=$(client_id) -var secret_id=$(secret_id)) -var ssh_public=$(publickey.secureFilePath)'
    backendServiceArm: 'resourceManagerTest'
    backendAzureRmResourceGroupName: 'azuretestrg'
    backendAzureRmStorageAccountName: 'azuretestrg'
    backendAzureRmContainerName: 'azuretestrg'
    backendAzureRmKey: 'k82026'
- script: |
    echo Add other tasks to build, test, and deploy your project.
    echo See https://aka.ms/yaml
  displayName: 'Run a multi-line script'
